# ==============================================================================
# TheNexopp Unified Production Nginx Configuration
# Multi-Site Isolated Architecture for KVM VPS
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Main Website & API (thenexopp.com & www.thenexopp.com) -> Port 8081
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name thenexopp.com www.thenexopp.com;

    client_max_body_size 50M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name thenexopp.com www.thenexopp.com;

    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/thenexopp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thenexopp.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Website Express API & Static Frontends
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Website Static Uploads
    location /uploads/ {
        alias /opt/thenexopp/uploads/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }
}

# ------------------------------------------------------------------------------
# 2. Existing Website Admin Portal (admin.thenexopp.com) -> Port 8081
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name admin.thenexopp.com;

    client_max_body_size 50M;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.thenexopp.com;

    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/admin.thenexopp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.thenexopp.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}

# ------------------------------------------------------------------------------
# 3. Agent NestJS REST API & WebSockets (api.thenexopp.com) -> Port 3000
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.thenexopp.com;

    client_max_body_size 50M;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.thenexopp.com;

    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/api.thenexopp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.thenexopp.com/privkey.pem;

    # 3.1 REST API endpoints
    location /api/v1/ {
        proxy_pass http://127.0.0.1:3000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # 3.2 Swagger OpenAPI Interactive Documentation
    location /api/docs {
        proxy_pass http://127.0.0.1:3000/api/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3.3 Socket.io & Native WebSockets Gateway
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:3000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 3.4 Direct Physical Storage Viewer for Agent Photos
    location /uploads/ {
        alias /opt/thenexopp-agent/backend/uploads/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # 3.5 Fallback to Agent Admin SPA
    location / {
        root /opt/thenexopp-agent/admin/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

# ------------------------------------------------------------------------------
# 4. Agent Admin Portal Dedicated Host (agent-admin.thenexopp.com)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name agent-admin.thenexopp.com;

    client_max_body_size 50M;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agent-admin.thenexopp.com;

    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/agent-admin.thenexopp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent-admin.thenexopp.com/privkey.pem;

    root /opt/thenexopp-agent/admin/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests directly
    location /api/v1/ {
        proxy_pass http://127.0.0.1:3000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:3000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
