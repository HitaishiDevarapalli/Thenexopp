# ==============================================================================
# TheNexopp Unified Production Nginx Configuration
# Multi-Site Isolated Architecture for KVM VPS (/opt/Thenexopp)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Main Website & Unified Ingress (thenexopp.com & www.thenexopp.com)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name thenexopp.com www.thenexopp.com;

    client_max_body_size 50M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name thenexopp.com www.thenexopp.com;

    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/thenexopp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thenexopp.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 1.1 Agent NestJS REST API Gateway on Main Domain
    location /api/v1/ {
        proxy_pass http://127.0.0.1:3000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # 1.2 Agent API Swagger Docs
    location /api/docs {
        proxy_pass http://127.0.0.1:3000/api/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 1.3 Agent Real-Time WebSockets
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:3000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 1.4 Agent Admin Subpath Direct Access (/agent-admin)
    location ^~ /agent-admin/ {
        alias "/opt/Thenexopp/thenexopp app/nexopp-app/admin/dist/";
        try_files $uri $uri/ /index.html;
    }

    location = /agent-admin {
        return 301 /agent-admin/;
    }

    # 1.5 Agent Uploaded Photos & KYC View
    location /agent-uploads/ {
        alias "/opt/Thenexopp/thenexopp app/nexopp-app/backend/uploads/";
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # 1.6 Website Express API & Static Frontend (Port 8081)
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}

