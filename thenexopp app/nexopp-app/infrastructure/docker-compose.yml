version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: thenexopp_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER:-thenexopp_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-thenexopp_secure_pass_2026}
      POSTGRES_DB: ${DATABASE_NAME:-thenexopp_agent_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - thenexopp_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-thenexopp_user} -d ${DATABASE_NAME:-thenexopp_agent_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: thenexopp_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-thenexopp_redis_secure_2026}
    volumes:
      - redis_data:/data
    networks:
      - thenexopp_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-thenexopp_redis_secure_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: thenexopp_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-thenexopp_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-thenexopp_minio_secure_pass_2026}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - thenexopp_net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: thenexopp_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-thenexopp_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-thenexopp_secure_pass_2026}
      DATABASE_NAME: ${DATABASE_NAME:-thenexopp_agent_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-thenexopp_redis_secure_2026}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-thenexopp_minio_admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-thenexopp_minio_secure_pass_2026}
      JWT_SECRET: ${JWT_SECRET:-tnx_access_secret_super_secure_key_987654321_2026_prod}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-tnx_refresh_secret_super_secure_key_123456789_2026_prod}
      AES_ENCRYPTION_KEY: ${AES_ENCRYPTION_KEY:-32_bytes_long_secret_encryption_key_2026!!}
      OTP_PROVIDER: ${OTP_PROVIDER:-MSG91}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-557093Aca5G41bF6a7d8d93P1}
      MSG91_TEMPLATE_ID: ${MSG91_TEMPLATE_ID:-6a95648afdf721447f020ac2}
      OTP_SENDER_ID: ${OTP_SENDER_ID:-THNXPP}
      OTP_EXPIRY_SECONDS: ${OTP_EXPIRY_SECONDS:-300}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-60}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - thenexopp_net

  admin_portal:
    build:
      context: ../admin
      dockerfile: Dockerfile
    container_name: thenexopp_admin_portal
    restart: always
    ports:
      - "3001:80"
    networks:
      - thenexopp_net

networks:
  thenexopp_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
