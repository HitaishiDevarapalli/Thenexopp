name: thenexopp_agent
description: Commercial Mobile Application for TheNexopp Agents built with Flutter, Riverpod, GoRouter, and Dio.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation & Routing
  go_router: ^13.1.0

  # Networking & HTTP
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1

  # Secure Storage & Local Cache
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Realtime WebSockets & Push
  socket_io_client: ^2.0.3+1

  # UI Components, Icons & SVG
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  intl: ^0.20.2
  pin_code_fields: ^8.0.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Device Runtime Permissions Handler
  permission_handler: ^11.3.1

  # SMS OTP AutoFill
  sms_autofill: ^2.3.0

  # Camera & Image Compression
  image_picker: ^1.0.7
  flutter_image_compress: ^2.1.0

  # Location & Free OpenStreetMap Geocoding
  geolocator: ^10.1.0

  # App Infrastructure & Utilities
  path_provider: ^2.1.2
  url_launcher: ^6.2.4
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
