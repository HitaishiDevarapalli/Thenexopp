<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="nexoppFaviconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
  </defs>
  <!-- Clean Crisp Rounded Background for Dark and Light Browser Tabs -->
  <rect width="64" height="64" rx="14" fill="url(#nexoppFaviconBg)" stroke="#CBD5E1" stroke-width="1.5" />
  
  <!-- Centered TheNexopp Official Brand Mark -->
  <g transform="translate(4, 18.5) scale(0.1166)">
    <!-- Dark Blue Primary House Roof -->
    <path d="M 135 90 L 205 28 L 275 90 H 260 L 205 42 L 150 90 Z" fill="#002B66" />

    <!-- 4-Pane Window on Blue House -->
    <rect x="194" y="65" width="10" height="10" fill="#002B66" />
    <rect x="207" y="65" width="10" height="10" fill="#002B66" />
    <rect x="194" y="78" width="10" height="10" fill="#002B66" />
    <rect x="207" y="78" width="10" height="10" fill="#002B66" />

    <!-- Golden Yellow Secondary Buildings -->
    <rect x="284" y="20" width="16" height="70" fill="#D97706" />
    <rect x="305" y="42" width="14" height="48" fill="#D97706" />
    <rect x="323" y="60" width="12" height="30" fill="#D97706" />

    <!-- Text "The" (Golden Yellow) -->
    <text x="30" y="155" fill="#D97706" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="68" letter-spacing="-1px">The</text>

    <!-- Text "Nex" (Deep Navy Blue) -->
    <text x="156" y="155" fill="#002B66" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="68" letter-spacing="-1px">Nex</text>

    <!-- Magnifying Glass Opportunity 'O' -->
    <circle cx="320" cy="132" r="22" stroke="#059669" stroke-width="10" fill="none" />
    <line x1="334" y1="147" x2="350" y2="168" stroke="#059669" stroke-width="10" stroke-linecap="round" />

    <!-- Text "pp" (Emerald Green) -->
    <text x="356" y="155" fill="#059669" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="68" letter-spacing="-1px">pp</text>

    <!-- Dynamic Curved Green Swoop Underline -->
    <path d="M 38 188 Q 240 162 432 188 Q 240 174 38 188 Z" fill="#059669" />
  </g>
</svg>